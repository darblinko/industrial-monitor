# Lint and test on every push and pull request. Tests run offline with the fake model;
# no API key is used. A local Mosquitto broker enables the tests marked "broker".
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: "1883"
    steps:
      - uses: actions/checkout@v4
      - name: Start Mosquitto with the repository configuration
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto || true
          mosquitto -c mosquitto/mosquitto.conf -d
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
