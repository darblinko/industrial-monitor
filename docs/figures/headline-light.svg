<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Detector on the held-out simulated plant</title><desc>94.8% of fault windows detected, 0.86% false alarms on healthy windows.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="30.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Detector on the held-out simulated plant</text><text x="24.0" y="50.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Threshold calibrated on a separate plant, then frozen</text><line x1="24.0" y1="80.0" x2="24.0" y2="150.0" stroke="#c3c2b7" stroke-width="2"/><text x="38.0" y="114.0" font-size="32" font-weight="600" fill="#0b0b0b" text-anchor="start">94.8%</text><text x="38.0" y="134.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Fault windows detected</text><text x="38.0" y="150.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="start">1,805 labeled fault windows</text><line x1="202.0" y1="80.0" x2="202.0" y2="150.0" stroke="#c3c2b7" stroke-width="2"/><text x="216.0" y="114.0" font-size="32" font-weight="600" fill="#0b0b0b" text-anchor="start">0.86%</text><text x="216.0" y="134.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">False alarms</text><text x="216.0" y="150.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="start">1,395 healthy windows</text><line x1="380.0" y1="80.0" x2="380.0" y2="150.0" stroke="#c3c2b7" stroke-width="2"/><text x="394.0" y="114.0" font-size="32" font-weight="600" fill="#0b0b0b" text-anchor="start">2.55</text><text x="394.0" y="134.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Alarm threshold (z)</text><text x="394.0" y="150.0" font-size="11" font-weight="400" fill="#6f6d68" text-anchor="start">dev seed 101</text><line x1="558.0" y1="80.0" x2="558.0" y2="150.0" stroke="#c