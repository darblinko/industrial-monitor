[project]
name = "industrial-monitor"
version = "0.1.0"
description = "Reference IoT pipeline: Ruuvi RAWv2 sensor payloads over MQTT, FFT vibration anomaly detection, and a cited maintenance assistant with an evaluation suite."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mitchell Foutz" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "paho-mqtt>=2.1",
]

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
ble = ["bleak>=0.22"]

[project.scripts]
industrial-monitor = "industrial_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["broker: needs a running MQTT broker at MQTT_HOST"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
